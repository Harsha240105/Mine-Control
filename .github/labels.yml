# GitHub Labels Configuration
# Managed via https://github.com/Harsha240105/Mine-Control/labels
# Sync with: gh label clone Harsha240105/Mine-Control --force

# Issue Type Labels
- name: bug
  color: d73a4a
  description: Something isn't working as expected
- name: feature
  color: a2eeef
  description: New feature request or enhancement
- name: performance
  color: ffb8c6
  description: Performance or scalability issue
- name: documentation
  color: 0075ca
  description: Improvements or additions to documentation
- name: question
  color: d876e3
  description: Further information is requested
- name: security
  color: e99695
  description: Security vulnerability or concern

# Priority Labels
- name: priority-low
  color: bfe5bf
  description: Low priority — nice to have
- name: priority-normal
  color: fbefd2
  description: Normal priority — default
- name: priority-high
  color: ffa07a
  description: High priority — should be addressed soon
- name: priority-critical
  color: d93f0b
  description: Critical priority — must be addressed immediately

# Status Labels
- name: status-triage
  color: c2e0c6
  description: Needs review and classification
- name: status-accepted
  color: 0e8a16
  description: Accepted and planned for implementation
- name: status-in-progress
  color: fbca04
  description: Currently being worked on
- name: status-needs-info
  color: cfd3d7
  description: Waiting for more information from reporter
- name: status-wontfix
  color: ffffff
  description: Will not be implemented or fixed
- name: status-duplicate
  color: cfd3d7
  description: Duplicate of another issue

